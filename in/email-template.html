<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="x-apple-disable-message-reformatting">
   <title>Giraf Creatives — New Enquiry</title>
   <!--[if mso]>
   <noscript>
      <xml>
         <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
         </o:OfficeDocumentSettings>
      </xml>
   </noscript>
   <![endif]-->
   <style>
      html, body {
         margin: 0 !important;
         padding: 0 !important;
         height: 100% !important;
         width: 100% !important;
      }
      * {
         -ms-text-size-adjust: 100%;
         -webkit-text-size-adjust: 100%;
      }
      table, td {
         mso-table-lspace: 0pt !important;
         mso-table-rspace: 0pt !important;
      }
      table {
         border-spacing: 0 !important;
         border-collapse: collapse !important;
      }
      img {
         -ms-interpolation-mode: bicubic;
         border: 0;
         outline: none;
         text-decoration: none;
         display: block;
      }
      a { text-decoration: none; }
      .ReadMsgBody { width: 100%; }
      .ExternalClass { width: 100%; }
      .ExternalClass, .ExternalClass p, .ExternalClass span, .ExternalClass font, .ExternalClass td, .ExternalClass div {
         line-height: 100%;
      }
      #MessageViewBody, #MessageWebViewDiv {
         width: 100% !important;
      }

      @media only screen and (max-width: 620px) {
         .email-wrapper {
            width: 100% !important;
            padding: 16px 12px !important;
         }
         .email-card {
            width: 100% !important;
            border-radius: 14px !important;
         }
         .email-pad {
            padding-left: 20px !important;
            padding-right: 20px !important;
         }
         .email-pad-lg {
            padding: 28px 20px !important;
         }
         .detail-label {
            width: 30% !important;
            font-size: 13px !important;
            padding: 10px 8px 10px 0 !important;
         }
         .detail-value {
            width: 70% !important;
            font-size: 14px !important;
            padding: 10px 0 !important;
         }
         .msg-title {
            font-size: 13px !important;
            padding: 12px 16px !important;
         }
         .msg-body {
            font-size: 14px !important;
            padding: 16px !important;
         }
         .footer-text {
            font-size: 12px !important;
            line-height: 18px !important;
         }
         .logo-main {
            width: 110px !important;
         }
         .logo-footer {
            width: 48px !important;
         }
         .social-icon {
            width: 28px !important;
            height: 28px !important;
         }
         .site-bar {
            font-size: 13px !important;
            padding: 14px 16px !important;
         }
      }
   </style>
</head>

<body style="margin:0; padding:0; width:100%; background-color:#f0eee9; -webkit-font-smoothing:antialiased;">
   <!-- Preheader (hidden) -->
   <div style="display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;">
      New enquiry from {{name}} — {{subject}}
   </div>

   <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f0eee9;">
      <tr>
         <td align="center" class="email-wrapper" style="padding:36px 16px;">

            <table role="presentation" class="email-card" cellpadding="0" cellspacing="0" border="0" width="600" style="width:100%; max-width:600px; background-color:#ffffff; border-radius:18px; overflow:hidden; box-shadow:0 8px 32px rgba(17,17,17,0.08);">

               <!-- Brand accent -->
               <tr>
                  <td style="height:5px; background-color:#F9B217; font-size:0; line-height:0;">&nbsp;</td>
               </tr>

               <!-- Logo -->
               <tr>
                  <td align="center" class="email-pad-lg" style="padding:36px 40px 32px;">
                     <img class="logo-main" src="https://girafcreatives.com/in/img/email/logo.png" alt="Giraf" width="120" style="width:120px; max-width:120px; height:auto; margin:0 auto;">
                  </td>
               </tr>

               <!-- Details card -->
               <tr>
                  <td class="email-pad" style="padding:0 40px 8px;">
                     <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#faf9f6; border-radius:12px; border:1px solid #eeebe4;">
                        <tr>
                           <td style="padding:8px 24px;">
                              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                                 <tr>
                                    <td class="detail-label" width="28%" valign="top" style="padding:12px 12px 12px 0; font-family:Arial, Helvetica, sans-serif; font-size:13px; color:#888888; font-weight:700; border-bottom:1px solid #eeebe4;">
                                       Name
                                    </td>
                                    <td class="detail-value" width="72%" valign="top" style="padding:12px 0; font-family:Arial, Helvetica, sans-serif; font-size:15px; color:#1a1a1a; border-bottom:1px solid #eeebe4;">
                                       {{name}}
                                    </td>
                                 </tr>
                                 <tr>
                                    <td class="detail-label" width="28%" valign="top" style="padding:12px 12px 12px 0; font-family:Arial, Helvetica, sans-serif; font-size:13px; color:#888888; font-weight:700; border-bottom:1px solid #eeebe4;">
                                       Email
                                    </td>
                                    <td class="detail-value" width="72%" valign="top" style="padding:12px 0; font-family:Arial, Helvetica, sans-serif; font-size:15px; color:#1a1a1a; border-bottom:1px solid #eeebe4;">
                                       <a href="mailto:{{email}}" style="color:#1a6fcc; text-decoration:underline;">{{email}}</a>
                                    </td>
                                 </tr>
                                 <tr>
                                    <td class="detail-label" width="28%" valign="top" style="padding:12px 12px 12px 0; font-family:Arial, Helvetica, sans-serif; font-size:13px; color:#888888; font-weight:700; border-bottom:1px solid #eeebe4;">
                                       Phone
                                    </td>
                                    <td class="detail-value" width="72%" valign="top" style="padding:12px 0; font-family:Arial, Helvetica, sans-serif; font-size:15px; color:#1a1a1a; border-bottom:1px solid #eeebe4;">
                                       <a href="tel:{{phone}}" style="color:#1a1a1a; text-decoration:none;">{{phone}}</a>
                                    </td>
                                 </tr>
                                 <tr>
                                    <td class="detail-label" width="28%" valign="top" style="padding:12px 12px 12px 0; font-family:Arial, Helvetica, sans-serif; font-size:13px; color:#888888; font-weight:700;">
                                       Subject
                                    </td>
                                    <td class="detail-value" width="72%" valign="top" style="padding:12px 0; font-family:Arial, Helvetica, sans-serif; font-size:15px; color:#1a1a1a;">
                                       {{subject}}
                                    </td>
                                 </tr>
                              </table>
                           </td>
                        </tr>
                     </table>
                  </td>
               </tr>

               <!-- Message -->
               <tr>
                  <td class="email-pad" style="padding:20px 40px 8px;">
                     <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-radius:12px; overflow:hidden; border:1px solid #eeebe4;">
                        <tr>
                           <td class="msg-title" style="background-color:#0A0A0B; padding:14px 20px; font-family:Arial, Helvetica, sans-serif; font-size:12px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#ffffff;">
                              Message
                           </td>
                        </tr>
                        <tr>
                           <td class="msg-body" style="padding:20px; background-color:#ffffff; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#333333;">
                              {{message}}
                           </td>
                        </tr>
                     </table>
                  </td>
               </tr>

               <!-- Divider -->
               <tr>
                  <td class="email-pad" style="padding:28px 40px 0;">
                     <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                        <tr>
                           <td style="height:1px; background-color:#eeebe4; font-size:0; line-height:0;">&nbsp;</td>
                        </tr>
                     </table>
                  </td>
               </tr>

               <!-- Footer -->
               <tr>
                  <td class="email-pad" align="center" style="padding:28px 40px 8px;">
                     <img class="logo-footer" src="https://girafcreatives.com/in/img/email/logo.png" alt="Giraf" width="52" style="width:52px; max-width:52px; height:auto; margin:0 auto 14px;">

                     <p class="footer-text" style="margin:0 0 6px; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:18px; color:#777777;">
                        Masters Building Mavoor,<br>
                        Calicut - 673661<br>
                        Calicut, Kerala, India
                     </p>

                     <p class="footer-phone" style="margin:12px 0 0; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:18px; color:#555555;">
                        <a href="tel:+918075461989" style="color:#555555; text-decoration:none;">Tel: +91 80 75 46 19 89</a>
                        <span style="color:#cccccc; padding:0 6px;">||</span>
                        <a href="tel:+918075461989" style="color:#555555; text-decoration:none;">Mob: +91 80 75 46 19 89</a>
                     </p>
                  </td>
               </tr>

               <!-- Social -->
               <tr>
                  <td align="center" style="padding:18px 40px 28px;">
                     <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                           <td style="padding:0 6px;">
                              <a href="https://www.facebook.com/people/GIRAF/100088398906381/" target="_blank" style="text-decoration:none;">
                                 <img class="social-icon" src="https://girafcreatives.com/in/img/email/facebook.png" alt="Facebook" width="26" height="26" style="width:26px; height:26px; display:block;">
                              </a>
                           </td>
                           <td style="padding:0 6px;">
                              <a href="https://www.youtube.com/@Giraf_Creatives" target="_blank" style="text-decoration:none;">
                                 <img class="social-icon" src="https://girafcreatives.com/in/img/email/youtube.png" alt="YouTube" width="26" height="26" style="width:26px; height:26px; display:block;">
                              </a>
                           </td>
                           <td style="padding:0 6px;">
                              <a href="https://www.linkedin.com/company/girafcreatives/?viewAsMember=true" target="_blank" style="text-decoration:none;">
                                 <img class="social-icon" src="https://girafcreatives.com/in/img/email/linkedin.png" alt="LinkedIn" width="26" height="26" style="width:26px; height:26px; display:block;">
                              </a>
                           </td>
                           <td style="padding:0 6px;">
                              <a href="https://www.instagram.com/girafcreatives/" target="_blank" style="text-decoration:none;">
                                 <img class="social-icon" src="https://girafcreatives.com/in/img/email/instagram.png" alt="Instagram" width="26" height="26" style="width:26px; height:26px; display:block;">
                              </a>
                           </td>
                        </tr>
                     </table>
                  </td>
               </tr>

               <!-- Website bar -->
               <tr>
                  <td class="site-bar" align="center" style="background-color:#0A0A0B; padding:16px 24px; font-family:Arial, Helvetica, sans-serif; font-size:13px; letter-spacing:0.06em;">
                     <a href="https://girafcreatives.com/" target="_blank" style="color:#ffffff; text-decoration:none; font-weight:500;">
                        www.girafcreatives.com
                     </a>
                  </td>
               </tr>

            </table>

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
               <tr>
                  <td style="height:24px; font-size:0; line-height:0;">&nbsp;</td>
               </tr>
            </table>

         </td>
      </tr>
   </table>
</body>
</html>
